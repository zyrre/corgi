[package]
name = "corgi"
version = "0.2.3"
edition = "2024"
rust-version = "1.89"
description = "A small, quick Herdr dashboard for coding agents"
license = "MIT"
repository = "https://github.com/zyrre/corgi"
homepage = "https://github.com/zyrre/corgi"
readme = "README.md"
keywords = ["herdr", "tui", "agents", "claude", "codex"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
color_quant = "1.1"
gif = "0.14.2"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
