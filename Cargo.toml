[workspace]
members = [".", "crates/corgi-core"]
# Plain `cargo build`, `cargo test` and `cargo clippy` at the root cover the
# whole workspace, as the handoff commands in AGENTS.md expect.
default-members = [".", "crates/corgi-core"]
resolver = "3"

# What every crate shares. `version` is the release's: the release workflow
# checks this line against the tag.
[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/zyrre/corgi"
homepage = "https://github.com/zyrre/corgi"

[workspace.dependencies]
anyhow = "1.0"
corgi-core = { path = "crates/corgi-core" }
libc = "0.2"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[package]
name = "corgi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A small, quick Herdr dashboard for coding agents"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["herdr", "tui", "agents", "claude", "codex"]
categories = ["command-line-utilities"]

[dependencies]
anyhow.workspace = true
corgi-core.workspace = true
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
color_quant = "1.1"
corgi-core = { workspace = true, features = ["test-support"] }
gif = "0.14.2"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
