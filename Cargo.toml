[package]
name = "corgi"
version = "0.2.3"
edition = "2024"
rust-version = "1.89"
description = "A supervisor and its worker agents on herdr-core, for the Herdr app"
license = "MIT"
repository = "https://github.com/zyrre/corgi"
homepage = "https://github.com/zyrre/corgi"
readme = "README.md"
keywords = ["herdr", "agents", "claude", "codex"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
png = "0.18.1"
resvg = { version = "0.48.1", default-features = false }
