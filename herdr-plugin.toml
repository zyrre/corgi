id = "io.github.zyrre.corgi"
name = "Corgi"
version = "0.2.3"
min_herdr_version = "0.8.2"
description = "A small, quick dashboard for Herdr coding agents."
platforms = ["linux", "macos"]

# Downloads this version's binary only when it matches a committed checksum
# pin; otherwise builds local source with cargo (see the script for overrides).
[[build]]
command = ["sh", "scripts/install.sh"]

# Bind this to a key in ~/.config/herdr/config.toml:
#   [[keys.command]]
#   key = "prefix+d"
#   type = "plugin_action"
#   command = "io.github.zyrre.corgi.open"
[[actions]]
id = "open"
title = "Corgi (open or focus)"
description = "Opens the Corgi dashboard tab, or focuses the one already running."
contexts = ["workspace", "pane"]
command = ["bash", "scripts/herdr-corgi-dashboard"]

# Opens the focused agent's checkout, or the one selected in a focused Corgi
# dashboard, in $VISUAL or $EDITOR in a new tab. Bind it like `open`:
#   [[keys.command]]
#   key = "prefix+e"
#   type = "plugin_action"
#   command = "io.github.zyrre.corgi.edit"
[[actions]]
id = "edit"
title = "Corgi: edit agent checkout"
description = "Opens the focused or selected agent's checkout in your editor in a new tab."
contexts = ["workspace", "pane"]
command = ["./target/release/corgi", "edit"]

[[panes]]
id = "dashboard"
title = "Corgi"
placement = "tab"
command = ["./target/release/corgi"]

[[panes]]
id = "quick"
title = "Corgi"
placement = "popup"
width = "88%"
height = "84%"
command = ["./target/release/corgi", "--compact"]

# Corgi's always-on work, with no dashboard open: Herdr runs `corgi hook` as
# its server starts or hands over, and on these events. Every run reconciles
# from Herdr's snapshot and Corgi's records, whatever the event, so one Herdr
# drops in a burst costs nothing; see `corgi hook --help` and "Herdr's hooks"
# in ARCHITECTURE.md.
[[startup]]
command = ["./target/release/corgi", "hook"]

[[events]]
on = "pane.agent_detected"
command = ["./target/release/corgi", "hook"]

[[events]]
on = "pane.agent_status_changed"
command = ["./target/release/corgi", "hook"]

[[events]]
on = "pane.exited"
command = ["./target/release/corgi", "hook"]

[[events]]
on = "pane.closed"
command = ["./target/release/corgi", "hook"]

[[events]]
on = "workspace.closed"
command = ["./target/release/corgi", "hook"]
