# Builds corgi for every platform scripts/install.sh downloads for, and
# publishes a GitHub release carrying the binaries and their SHA256SUMS.
#
# Runs when a `vX.Y.Z` tag is pushed. The tag must match `version` in both
# herdr-plugin.toml and Cargo.toml, or nothing is built. Every asset below
# must be present before the release is created, so a partial release is
# never published.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the manifest and Cargo.toml
        run: |
          version="${TAG#v}"
          grep -qx "version = \"$version\"" herdr-plugin.toml || { echo "::error::herdr-plugin.toml version is not $version"; exit 1; }
          grep -qx "version = \"$version\"" Cargo.toml || { echo "::error::Cargo.toml version is not $version"; exit 1; }

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            runs: true
          - target: x86_64-apple-darwin
            os: macos-14
            runs: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            runs: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            runs: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name the binary
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/corgi dist/corgi-${{ matrix.target }}

      - name: Check it runs and reports the release version
        if: matrix.runs
        run: |
          out=$(dist/corgi-${{ matrix.target }} --version)
          echo "$out"
          [ "$out" = "corgi ${TAG#v}" ] || { echo "::error::expected corgi ${TAG#v}"; exit 1; }

      - name: Check the Linux binary is static
        if: contains(matrix.target, 'musl')
        run: |
          file dist/corgi-${{ matrix.target }}
          file dist/corgi-${{ matrix.target }} | grep -Eq 'statically linked|static-pie linked' || { echo "::error::not a static binary"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: corgi-${{ matrix.target }}
          path: dist/corgi-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ASSETS: >-
        corgi-aarch64-apple-darwin
        corgi-x86_64-apple-darwin
        corgi-aarch64-unknown-linux-musl
        corgi-x86_64-unknown-linux-musl
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check every binary is there and write SHA256SUMS
        working-directory: dist
        run: |
          for asset in $ASSETS; do
            [ -s "$asset" ] || { echo "::error::$asset is missing"; exit 1; }
          done
          # shellcheck disable=SC2086 # $ASSETS is a word list
          sha256sum $ASSETS > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        working-directory: dist
        run: |
          # shellcheck disable=SC2086 # $ASSETS is a word list
          gh release create "$TAG" $ASSETS SHA256SUMS --verify-tag --title "$TAG" --generate-notes
