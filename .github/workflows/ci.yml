# Checks formatting, lints and tests on every pull request and every push to
# main, on Linux and macOS, the platforms Corgi supports: the Rust crate, and
# the scripts' and mods' own tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # The fake herdr-app socket in src/app_layout/tests.rs lives under
      # $TMPDIR, whose long default on macOS makes its path too long for a
      # socket.
      - name: Test
        env:
          TMPDIR: /tmp
        run: cargo test --locked

  # The mods under Node with stand-ins for the Herdr app, and the installers
  # against a fake release, cargo and herdr-app: none needs Rust or the app.
  # `herdr-app check` of each mod needs the Herdr app itself, which a runner
  # does not have, so it is run by hand (AGENTS.md).
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The tests load the mods through node:module's registerHooks.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Test the Corgi mod
        run: node scripts/test-app-mods.mjs

      - name: Test the Jenkins mod
        run: node herdr-app/mods/jenkins/tests/test.mjs

      - name: Test the Media mod
        run: node herdr-app/mods/media/tests/test.mjs

      - name: Test the installers
        run: bash scripts/test-install

  # The oldest Rust that builds Corgi (`rust-version` in Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89 --profile minimal
          rustup default 1.89

      - name: Check
        run: cargo check --locked --all-targets
