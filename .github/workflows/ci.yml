# Checks formatting, lints and tests on every pull request and every push to
# main, on Linux and macOS, the platforms Corgi supports.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # The fake Herdr socket in crates/corgi-core/src/test_support.rs lives under $TMPDIR,
      # whose long default on macOS makes its path too long for a socket.
      - name: Test
        env:
          TMPDIR: /tmp
        run: cargo test --locked
